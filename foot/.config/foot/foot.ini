[main]
font=JetBrainsMono Nerd Font:size=13
include=/usr/share/foot/themes/rose-pine
include=/usr/share/foot/themes/rose-pine-dawn
initial-color-theme=dark
pad=2x2 center

[cursor]
style=beam
blink=no

[key-bindings]
font-decrease=Control+Shift+minus
show-urls-copy=Control+Shift+i
color-theme-toggle=Control+Shift+t
