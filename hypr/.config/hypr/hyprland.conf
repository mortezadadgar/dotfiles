################
### MONITORS ###
################

monitor=,preferred,auto,auto

###################
### MY PROGRAMS ###
###################

$terminal = foot
$menu = fuzzel

###################
### ECOSYSTEM ###
###################

ecosystem {
	no_donation_nag = true
	no_update_news = true
}

#####################
### LOOK AND FEEL ###
#####################

general {
	gaps_in = 5
	gaps_out = 10

    border_size = 1

    col.active_border = rgb(C4A7E7)
    col.inactive_border = rgb(595959)

    resize_on_border = true

    layout = master
}

render {
    # result in black screen for mpv
    send_content_type = false
}

decoration {
    rounding = 5

    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = yes,

    #        NAME,           X0,   Y0,   X1,   Y1
    bezier = easeOutQuint,   0.23, 1,    0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear,         0,    0,    1,    1
    bezier = almostLinear,   0.5,  0.5,  0.75, 1
    bezier = quick,          0.15, 0,    0.1,  1

    #           NAME,          ONOFF, SPEED, CURVE,        [STYLE]
    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  0,     1.79,  almostLinear
    animation = fadeLayersOut, 0,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick
}

master {
    new_status = master
}

misc {
	disable_hyprland_logo = true
}

xwayland {
	enabled = false
}

#############
### INPUT ###
#############

input {
    kb_layout = us,ir
    kb_options = grp:alt_shift_toggle,caps:escape
    repeat_rate = 50
    repeat_delay = 300

    follow_mouse = 0
    float_switch_override_focus = 0
}

###################
### KEYBINDINGS ###
###################

$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod  SHIFT, Q, killactive,
bind = $mod, S, togglefloating,
bind = $mod, D, exec, $menu
bind = $mod, SPACE, layoutmsg, swapwithmaster
bind = $mod, M, fullscreen
bind = $mod, TAB, workspace, previous

# Move focus
bind = $mod, j, layoutmsg, cyclenext
bind = $mod, k, layoutmsg, cycleprev

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

# scratchpad
workspace = special:terminal, on-created-empty:[float; size 800 600; center] foot, persistent:false
bind = $mod, U, togglespecialworkspace, terminal

# Scroll through existing workspaces with mod + scroll
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# resize windows with keyboard
bind = $mod , h, resizeactive, -50 0
bind = $mod , l, resizeactive, 50 0

# programs
bind = $mod&Control_L, Equal, exec, dmenupass
bind = $mod&Control_L, P, exec, dmenupower
bind = $mod&Control_L, M, exec, open-ncmpcpp
bind = $mod, Print, exec, shotmenu

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; pkill -RTMIN+8 waybar
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Control media players
bindl = ,XF86AudioNext, exec, playerctl next
bindl = ,XF86AudioPrev, exec, playerctl previous
bindl = ,XF86AudioPause, exec, playerctl play-pause
bindl = ,XF86AudioPlay, exec, playerctl play-pause

# Control media players for non multimedia keyboard
bindl = ,End, exec, playerctl next
bindl = ,Home, exec, playerctl previous
bindl  = $mod, End, exec, playerctl position 10+
bindl  = $mod, Home, exec, playerctl position 10-
bindl = ,Insert, exec, playerctl play-pause
bindl =  $mod, Insert, exec, playerctl stop

# Control volume for non multimedia keyboard
bindel = ,Page_Up, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,Page_Down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,Pause, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,Scroll_Lock, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle; pkill -RTMIN+8 waybar

# monitor brightness
bindel = ,F11, exec, ddcutil setvcp 10 - 10 --skip-ddc-checks --bus 3
bindel = ,F12, exec, ddcutil setvcp 10 + 10 --skip-ddc-checks --bus 3

# notifications
bind = Control_L&Shift_L, SPACE, exec, makoctl restore
bind = Control_L, SPACE, exec, makoctl dismiss

# wf-recorder
bind = Alt, F9, exec, record-screen


##############################
### WINDOWS AND WORKSPACES ###
##############################

# Rules
windowrule = workspace 2, match:class ^(firefox)$
windowrule = workspace 2, match:class ^(brave-browser)$
windowrule = workspace 2, match:class ^(chromium)$
windowrule = workspace 3, match:class ^(org.telegram.desktop)$
windowrule = fullscreen on, match:title ^(Media viewer)$, match:class ^(org.telegram.desktop)$
windowrule = float on, size (monitor_w*0.5) (monitor_h*0.7), match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:title ^(Save File)$, match:class ^(org.telegram.desktop)$
windowrule = workspace 4, match:class ^(mpv)$
windowrule = workspace 5, match:class ^(org.pwmt.zathura)$
windowrule = workspace 6, float on, size (monitor_w*0.4), match:title ^(ncmpcpp)$
windowrule = workspace 7, match:class ^(org.mozilla.Thunderbird)$
windowrule = size (monitor_w*0.55), float on, workspace 8, match:class ^(org.qbittorrent.qBittorrent)$
windowrule = float on, match:class ^(Clockify)$
windowrule = float on, match:class ^(oblivion-desktop)$
windowrule = float on, match:class ^(Windscribe)$
windowrule = float on, size (monitor_w*0.55), match:class ^(org.kde.kdeconnect.app)$
windowrule = float on, size (monitor_w*0.45), match:title ^(floating)$
windowrule = float on, match:class ^(hiddify)$
windowrule = float on, match:class ^(v2rayN)$
windowrule = float on, match:class ^(com.obsproject.Studio)$
